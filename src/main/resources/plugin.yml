name: RexSellwands
version: '${project.version}'
main: me.rexsystems.rexSellwands.RexSellwands
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Sell container contents with a wand
website: https://rexsystems.me
softdepend: [PlaceholderAPI, Vault]

commands:
  rexsellwands:
    description: RexSellwands command
    aliases: [rsw, sellwand]
    usage: /rexsellwands <help|give|list|reload>

permissions:
  rexsellwands.use:
    description: Use a sell wand on a container
    default: true
  rexsellwands.give:
    description: Give sell wands
    default: op
  rexsellwands.reload:
    description: Reload RexSellwands
    default: op
