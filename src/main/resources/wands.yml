# Wand ids are the keys below. Use letters, numbers, underscores, and hyphens.
# uses: 0 means the wand does not run out.
# cooldown-seconds is per player, per wand id. 0 means no cooldown.
# sound and particles: an empty value disables that effect. Names are Bukkit enums.
# hologram: empty disables it. {price} is the amount paid.
# allowed-containers: CHEST, BARREL, ENDER_CHEST, TRAPPED_CHEST, SHULKER_BOX.
# SHULKER_BOX also matches colored shulker boxes.
# custom-model-data: 0 means no model data.
# This file is written only when it is missing. Reload will not replace your edits.

wands:
  basic:
    material: BLAZE_ROD
    name: "<!italic><gold>Sell Wand"
    lore:
      - "<!italic><gray>Left click a container to see the price"
      - "<!italic><gray>Right click to sell"
      - "<!italic><gray>Uses: <white>{uses}"
      - "<!italic><gray>Multiplier: <white>{multiplier}"
    custom-model-data: 0
    glow: true
    multiplier: 1.0
    uses: 0
    unbreakable: true
    cooldown-seconds: 0
    allowed-containers:
      - CHEST
      - BARREL
      - ENDER_CHEST
      - TRAPPED_CHEST
      - SHULKER_BOX
    particles: HAPPY_VILLAGER
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    hologram: "<green>+{price}"
